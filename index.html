<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/dw-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05FF3C" />
    <meta
      name="description"
      content="Learn to code by building real projects with real people. Explore structured Frontend, Backend, and DevOps tracks, 50 coding challenges, and community projects."
    />
    <meta property="og:title" content="Dev.wengi | Learn to code by building" />
    <meta
      property="og:description"
      content="Explore learning tracks, coding challenges, and real-world community projects. Build, share your work, and grow with Dev.wengi."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/hero.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/images/hero.jpg" />
    <title>Dev.wengi | Learn to code by building</title>

    <!-- Google Fonts: Inter, Exo 2, Onest, Oswald (Cyrillic + Latin subsets) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Exo+2:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Onest:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-white text-[#0A0A0A] font-sans antialiased selection:bg-[#05FF3C] selection:text-black min-h-screen">
    <div id="root"></div>

    <!-- Static form definitions for Netlify Forms detection.
         The React app submits to these via AJAX; names must match. -->
    <form name="contact-newsletter" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact-newsletter" />
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>
    <form name="footer-newsletter" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="footer-newsletter" />
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
